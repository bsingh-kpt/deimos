name: "Auto-Create Main to Stable PR"

on:
  push:
    tags:
      - 'v*'

jobs:
  create-pr:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Generate PR Content
        id: pr_content
        run: |
            # 1. Get the newly pushed tag on main
            git fetch --tags --force
            NEW_TAG="${{ github.ref_name }}"
            
            # 2. Find the most recent tag that exists on the stable branch
            # We sort stable's tags by topology/date to find the latest one
            LAST_STABLE_TAG=$(git tag --merged origin/stable --sort=-creatordate | head -n 1)
            
            # Fallback if stable has no tags yet (uses the first commit of the repo)
            if [ -z "$LAST_STABLE_TAG" ]; then
                START_POINT=$(git rev-list --max-parents=0 HEAD)
                echo "No previous stable tag found. Diffing from repo root."
            else
              START_POINT=$(echo "$LAST_STABLE_TAG" | sed 's/-stable//')
              echo "Found last stable checkpoint: $LAST_STABLE_TAG"
              echo "Converted to main counterpart: $START_POINT"
            fi
            
            echo "Comparing from Stable Tag ($LAST_STABLE_TAG) to New Main Tag ($NEW_TAG)"

            # 3. Extract Features
            FEATURES=$(git log $START_POINT..$NEW_TAG --oneline --grep="^feat" --pretty=format:"- %s" | sed -E 's/- feat(\(.*\))?: //g')
            if [ -z "$FEATURES" ]; then
                FEATURES="- Maintenance updates and internal stability improvements."
            fi

            # 4. Generate Full Changelog
            CHANGELOG=$(git log $START_POINT..$NEW_TAG --pretty=format:"- [%h] %s")

            # 5. Calculate Stats for "The Gist"
            FILES_CHANGED=$(git diff --name-only $START_POINT..$NEW_TAG | wc -l)
            STATS=$(git diff --shortstat $START_POINT..$NEW_TAG)

            # 5. Construct the Markdown Body
            {
              echo "body<<EOF"
              echo "## 🚀 Sync: Main to Stable"
              echo "This is an automated sync of tested changes from the development branch."
              echo ""
              echo "### 📝 Key Features"
              echo "$FEATURES"
              echo ""
              echo "### 📊 The Gist"
              echo "- **Files Impacted:** $FILES_CHANGED"
              echo "- **Changes:** $STATS"
              echo "- **Source:** \`${{ github.event.pull_request.head.ref }}\`"
              echo ""
              echo "### 🛠 Full Changelog"
              echo "<details><summary>Click to view all commits</summary>"
              echo ""
              echo "$CHANGELOG"
              echo "</details>"
              echo ""
              echo "---"
              echo "_Generated by GitHub Actions Workflow_"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
      
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: cpr
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_TITLE: "🚀 Sync: Main to Stable (${{ github.ref_name }})"
          PR_BODY: ${{ steps.pr_content.outputs.body }}
        run: |
          # Check if an open PR from main to stable already exists to prevent duplicate failures
          PR_EXISTS=$(gh pr list --head main --base stable --state open --json number --jq '.[0].number')
          
          if [ -n "$PR_EXISTS" ]; then
            echo "A Pull Request from main to stable already exists (#$PR_EXISTS). Updating description instead."
            gh pr edit "$PR_EXISTS" --title "$PR_TITLE" --body "$PR_BODY"
          else
            echo "Creating a new Pull Request from main to stable."
            gh pr create \
              --head main \
              --base stable \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi

      - name: Check PR Output
        run: |
          echo "Pull Request Created: ${{ steps.cpr.outputs.pull-request-url }}"