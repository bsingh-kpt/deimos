name: "Generate PR Description"

on:
    workflow_dispatch:
    pull_request:
        branches:
            - stable
        types:
            - opened
            - synchronize
            - reopened

jobs:
    generate-description:
        runs-on: ubuntu-24.04
        permissions:
            pull-requests: write
            contents: read

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # Essential to compare main and stable

            - name: Generate PR Content
              id: pr_content
              run: |
                  # 1. Get the newly pushed tag on main
                  NEW_TAG="${{ github.ref_name }}"
                  
                  # 2. Find the most recent tag that exists on the stable branch
                  # We sort stable's tags by topology/date to find the latest one
                  LAST_STABLE_TAG=$(git tag --merged origin/stable --sort=-creatordate | head -n 1)
                  
                  # Fallback if stable has no tags yet (uses the first commit of the repo)
                  if [ -z "$LAST_STABLE_TAG" ]; then
                      LAST_STABLE_TAG=$(git rev-list --max-parents=0 HEAD)
                  fi
                  
                  echo "Comparing from Stable Tag ($LAST_STABLE_TAG) to New Main Tag ($NEW_TAG)"
  
                  # 3. Extract Features
                  FEATURES=$(git log $LAST_STABLE_TAG..$NEW_TAG --oneline --grep="^feat" --pretty=format:"- %s" | sed -E 's/- feat(\(.*\))?: //g')
                  if [ -z "$FEATURES" ]; then
                      FEATURES="- Maintenance updates and internal stability improvements."
                  fi

                  # 4. Generate Full Changelog
                  CHANGELOG=$(git log $LAST_STABLE_TAG..$NEW_TAG --pretty=format:"- [%h] %s")

                  # 5. Calculate Stats for "The Gist"
                  FILES_CHANGED=$(git diff --name-only $LAST_STABLE_TAG..$NEW_TAG | wc -l)
                  STATS=$(git diff --shortstat $LAST_STABLE_TAG..$NEW_TAG)

                  # 5. Construct the Markdown Body
                  {
                    echo "body<<EOF"
                    echo "## 🚀 Sync: Main to Stable"
                    echo "This is an automated sync of tested changes from the development branch."
                    echo ""
                    echo "### 📝 Key Features"
                    echo "$FEATURES"
                    echo ""
                    echo "### 📊 The Gist"
                    echo "- **Files Impacted:** $FILES_CHANGED"
                    echo "- **Changes:** $STATS"
                    echo "- **Source:** \`${{ github.event.pull_request.head.ref }}\`"
                    echo ""
                    echo "### 🛠 Full Changelog"
                    echo "<details><summary>Click to view all commits</summary>"
                    echo ""
                    echo "$CHANGELOG"
                    echo "</details>"
                    echo ""
                    echo "---"
                    echo "_Generated by GitHub Actions Workflow_"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Update Pull Request Body
              uses: tzkhan/pr-update-action@v2
              with:
                  repo-token: "${{ secrets.GITHUB_TOKEN }}"
                  body-template: ${{ steps.pr_content.outputs.body }}
                  head-branch-regex: '.*' 
                  body-update-action: 'replace'
