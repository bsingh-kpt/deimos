name: "Generate PR Description"

on:
    pull_request:
        branches:
            - stable
        types: [ opened, synchronize, reopened ]

jobs:
    generate-description:
        runs-on: ubuntu-24.04
        permissions:
            pull-requests: write
            contents: read

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Essential to compare main and stable

            - name: Generate PR Content
              id: pr_content
              run: |
                  # 1. Extract Features (Commits starting with "feat")
                  # This cleans the "feat:" prefix for a professional look
                  FEATURES=$(git log origin/stable..${{ github.event.pull_request.head.sha }} --oneline --grep="^feat" --pretty=format:"- %s" | sed -E 's/- feat(\(.*\))?: //g')

                  if [ -z "$FEATURES" ]; then
                    FEATURES="- Maintenance updates and internal stability improvements."
                  fi

                  # 2. Generate Full Changelog
                  CHANGELOG=$(git log origin/stable..${{ github.event.pull_request.head.sha }} --pretty=format:"- [%h] %s")

                  # 3. Calculate Stats for "The Gist"
                  FILES_CHANGED=$(git diff --name-only origin/stable..${{ github.event.pull_request.head.sha }} | wc -l)
                  STATS=$(git diff --shortstat origin/stable..${{ github.event.pull_request.head.sha }})

                  # 4. Construct the Markdown Body
                  {
                    echo "body<<EOF"
                    echo "## 🚀 Sync: Main to Stable"
                    echo "This is an automated sync of tested changes from the development branch."
                    echo ""
                    echo "### 📝 Key Features"
                    echo "$FEATURES"
                    echo ""
                    echo "### 📊 The Gist"
                    echo "- **Files Impacted:** $FILES_CHANGED"
                    echo "- **Changes:** $STATS"
                    echo "- **Source:** \`${{ github.event.pull_request.head.ref }}\`"
                    echo ""
                    echo "### 🛠 Full Changelog"
                    echo "<details><summary>Click to view all commits</summary>"
                    echo ""
                    echo "$CHANGELOG"
                    echo "</details>"
                    echo ""
                    echo "---"
                    echo "_Generated by GitHub Actions Workflow_"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Update Pull Request Body
              uses: tzkhan/pr-update-action@v2
              with:
                  repo-token: "${{ secrets.GITHUB_TOKEN }}"
                  base64-pr-body: ${{ steps.pr_content.outputs.body }}
